name: Mise à jour des scores
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/maj_scores.py pronostics.json
      - run: |
          if ! git diff --quiet; then
            git config user.name "gombo-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -am "Scores mis à jour" && git push
          fi
